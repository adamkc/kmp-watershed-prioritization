# Scenario catalog for the KMP Watershed Prioritization Tool.
#
# Each scenario defines a named set of metrics and their starting
# weights. Metric names MUST match column names in the master data
# file (data/kmp_metrics.csv) exactly -- spaces, punctuation, and
# case all matter. Scenarios should reference only metrics that have
# real data; planned metrics (those with `planned: true` in
# data/metrics.yaml) cannot appear here.
#
# The scenarios below are intentionally narrow: 3-4 metrics each, each
# expressing a single coherent management thesis rather than a broad
# category sweep. Compound "balanced" scenarios (fire AND unburned AND
# biodiversity...) tend to average out and surface middle-of-the-road
# HUCs; single-thesis scenarios surface HUCs that actually match the
# thesis. Users can start from one of these and add/remove metrics in
# Step 3 to tune further.
#
# All weights start at 1 -- the user can adjust per-metric weight in
# Step 3.

scenarios:

  - id: postfire_meadows
    name: Post-fire Meadow Restoration
    description: >
      Watersheds that burned in the past 10 years, have inventoried
      meadows, and sit on federal land -- the classic "shovel-ready
      meadow restoration in an open post-fire canopy on public land"
      pattern.
    weights:
      "Recent fire (% area, 10yr)": 1
      "Meadow density (% area)": 1
      "Federal ownership (%)": 1

  - id: unburned_federal
    name: Fire-suppressed Federal Forest
    description: >
      Watersheds that have not burned in 30 years, carry high
      wildfire-hazard potential, and sit on federal land -- candidates
      for prescribed fire or fuels-reduction treatments through a
      federal partner.
    weights:
      "Unburned 30yr (%)": 1
      "Wildfire hazard potential": 1
      "Federal ownership (%)": 1

  - id: climate_refuge_meadows
    name: Climate-refuge Meadows
    description: >
      Meadows in watersheds with high topo-edaphic resilience and
      strong projected vegetation refugia -- places most likely to
      remain functional meadow systems under warming.
    weights:
      "Climate refugia score": 1
      "Climate resiliency index": 1
      "Meadow density (% area)": 1

  - id: salmonid_strongholds
    name: Salmonid Strongholds
    description: >
      Watersheds that host both Coho and Chinook salmon and are rich
      in native fish overall -- protect-and-enhance priorities for
      anadromous-fish conservation.
    weights:
      "Coho salmon present": 1
      "Chinook salmon present": 1
      "Native fish richness (# spp)": 1

  - id: snowmelt_headwaters
    name: Snowmelt-fed Headwaters
    description: >
      Watersheds with high April 1 snowpack, substantial lost-meadow
      potential, and low summer water stress -- the wet, snow-fed
      headwater systems where meadow rewatering has the biggest
      hydrologic payoff.
    weights:
      "Snowpack (peak SWE, mm)": 1
      "Lost meadow potential (% area)": 1
      "Summer water stress (CWD, mm)": 1

  - id: reburn_hotspots
    name: Reburn Hotspots on Federal Land
    description: >
      Watersheds that have burned in multiple years and carry high
      recent-fire severity, on federal land -- degraded post-fire
      landscapes where recovery has been repeatedly interrupted and a
      federal-partner intervention is most likely to stick.
    weights:
      "Reburn area (% area)": 1
      "High severity fire (% area)": 1
      "Federal ownership (%)": 1
